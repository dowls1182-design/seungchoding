<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승초딩 미연시 — 막차, 그리고 너</title>
<style>
  :root{ --bg1:#1a2438; --bg2:#0e1524; --panel:rgba(15,20,32,.86); --accent:#7aa2ff; --heart:#ff6b8a; --text:#eef2fb; --sub:#9fb0cf; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#05070d; color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh;}
  #game{position:relative; width:min(460px,100vw); height:min(860px,100vh); background:linear-gradient(180deg,var(--bg1),var(--bg2)); overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  #topbar{position:absolute; top:0; left:0; right:0; z-index:5; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);}
  #place{font-size:12.5px; color:var(--sub)} #place b{color:#8fe08f}
  #affwrap{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.92); padding:6px 11px; border-radius:20px; color:#333; font-size:12px; font-weight:700}
  #heart{color:var(--heart); font-size:15px}
  #affbar{width:78px; height:8px; background:#e6d6dc; border-radius:6px; overflow:hidden}
  #afffill{height:100%; width:0%; background:linear-gradient(90deg,#ffb0c0,var(--heart)); transition:width .5s}
  #stage{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;}
  #charWrap{width:74%; max-width:340px; margin-bottom:258px; transition:transform .4s, filter .5s; filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}
  #charWrap.enter{animation:pop .6s ease}
  @keyframes pop{from{transform:translateY(24px) scale(.95);opacity:.3}to{transform:none;opacity:1}}
  #game.warm #charWrap{filter:drop-shadow(0 0 34px rgba(255,120,150,.4)) drop-shadow(0 10px 26px rgba(0,0,0,.5))}
  #charImg{width:100%; display:none; border-radius:14px}
  .lights{position:absolute; bottom:280px; right:14px; display:flex; gap:13px; opacity:.45}
  .lights i{width:8px; height:32px; border-radius:3px; background:linear-gradient(180deg,#ffd98a,#8a6a2a); display:block}
  #announce{position:absolute; top:52px; left:0; right:0; z-index:8; display:flex; justify-content:center; pointer-events:none}
  #announce span{background:rgba(20,30,50,.92); border:1px solid rgba(122,162,255,.4); color:#cfe0ff; font-size:13px; font-weight:700; padding:8px 18px; border-radius:20px; box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #announce.show{animation:announce 2.8s ease}
  @keyframes announce{0%{opacity:0;transform:translateY(-12px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
  #dlg{position:absolute; left:0; right:0; bottom:0; z-index:6; padding:16px; background:linear-gradient(180deg,transparent,rgba(5,7,13,.65) 16%);}
  #panel{background:var(--panel); backdrop-filter:blur(6px); border:1px solid rgba(122,162,255,.25); border-radius:16px; padding:14px 18px 18px; min-height:172px; position:relative}
  #speakerRow{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px}
  #speaker{display:inline-block; font-weight:800; font-size:14px; color:var(--accent); background:rgba(122,162,255,.14); padding:4px 12px; border-radius:12px}
  #speaker.narr{color:var(--sub); background:rgba(159,176,207,.12)}
  #speaker.me{color:#ffd18a; background:rgba(255,209,138,.12)}
  #meta{font-size:11px; color:var(--sub); text-align:right; max-width:150px}
  #text{font-size:15.5px; line-height:1.74; min-height:66px; white-space:pre-wrap}
  #choices{display:flex; flex-direction:column; gap:8px; margin-top:13px}
  .choice{display:flex; align-items:center; gap:10px; background:rgba(122,162,255,.1); border:1px solid rgba(122,162,255,.32); color:var(--text); padding:11px 13px; border-radius:12px; font-size:14px; text-align:left; cursor:pointer; transition:.15s; font-family:inherit}
  .choice:hover{background:rgba(122,162,255,.22); transform:translateX(3px)}
  .tag{flex:none; font-size:11px; font-weight:700; padding:3px 9px; border-radius:9px; background:rgba(122,162,255,.25); color:#cfe0ff}
  .tag.warm{background:rgba(255,150,170,.22); color:#ffc4d0}
  .tag.calm{background:rgba(150,200,180,.2); color:#bfe8d6}
  .tag.fun{background:rgba(255,210,120,.2); color:#ffe0a0}
  .tag.dark{background:rgba(150,160,190,.18); color:#c2c9dc}
  #next{position:absolute; right:16px; bottom:12px; color:var(--accent); font-size:12px; animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .screen{position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:34px; background:linear-gradient(180deg,rgba(10,16,30,.74),rgba(5,7,13,.95))}
  .screen h1{font-size:26px; letter-spacing:.5px; margin-bottom:10px; line-height:1.35}
  .screen p{color:var(--sub); font-size:14px; line-height:1.85; margin-bottom:22px}
  .btn{background:linear-gradient(90deg,#7aa2ff,#9a7aff); color:#fff; border:none; padding:14px 34px; border-radius:26px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 8px 24px rgba(122,162,255,.4)}
  .btn:hover{filter:brightness(1.08)}
  .hidden{display:none !important}
  .end-emoji{font-size:46px; margin-bottom:6px}
  .end-badge{font-size:12px; color:var(--accent); letter-spacing:1px; margin-bottom:14px; font-weight:700}
</style>
</head>
<body>
<div id="game">
  <div id="title" class="screen">
    <div style="font-size:13px;letter-spacing:3px;color:#7aa2ff;font-weight:700;margin-bottom:10px">승초딩 미연시</div>
    <h1>막차, 그리고 너</h1>
    <p>대학 오면 뭔가 다를 줄 알았지.<br>새벽 1시 30분, 군자행 5호선 막차.<br>카트라이더나 하려던 그 밤, 누군가 내 어깨를 두드렸다.</p>
    <button class="btn" onclick="startGame()">시작하기 ♡</button>
  </div>

  <div id="topbar" class="hidden">
    <div id="place"><span id="prevSt">행당</span> · <b id="curSt">왕십리</b> · <span id="nextSt">마장</span></div>
    <div id="affwrap"><span id="heart">♥</span><div id="affbar"><div id="afffill"></div></div><span id="affnum">0%</span></div>
  </div>
  <div id="announce" class="hidden"><span id="announceTxt"></span></div>

  <div id="stage" class="hidden">
    <div class="lights"><i></i><i></i><i></i><i></i></div>
    <div id="charWrap"><img id="charImg" alt="채민"></div>
  </div>

  <div id="dlg" class="hidden">
    <div id="panel">
      <div id="speakerRow"><span id="speaker" class="narr">나레이션</span><span id="meta"></span></div>
      <div id="text"></div>
      <div id="choices"></div>
      <span id="next" class="hidden">▼ 탭</span>
    </div>
  </div>

  <div id="ending" class="screen hidden">
    <div class="end-emoji" id="endEmoji">♡</div>
    <div class="end-badge" id="endBadge"></div>
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button class="btn" onclick="location.reload()">다시 하기</button>
  </div>
</div>

/* ===== 엔딩 (호감도 + 선택 플래그로 결정) ===== */
function pickEnding(aff, f){
  if(f.cold && f.insta) return "cross";        // 여기까지 왔는데 스스로 밀어낸 씁쓸한 결말
  if(f.gag && aff>=30 && aff<62) return "gag";
  if(aff>=72 && f.deep) return "unmei";
  if(aff>=72) return "truce";
  if(aff>=48) return "some";
  if(aff>=26) return "hope";
  return "lonely";
}

let affection=0, flags={};
const $=id=>document.getElementById(id);

function startGame(){
  $("title").classList.add("hidden");
  ["topbar","stage","dlg"].forEach(x=>$(x).classList.remove("hidden"));
  if(CHAR_IMG.normal && !CHAR_IMG.normal.includes("__CHAR")){ $("charImg").src=CHAR_IMG.normal; $("charImg").style.display="block"; }
  $("charWrap").classList.add("enter");
  render("a1");
}
function setAffection(d){
  affection=Math.max(0,Math.min(100,affection+d));
  $("afffill").style.width=affection+"%"; $("affnum").textContent=affection+"%";
  $("game").classList.toggle("warm", affection>=45);
}
function showStation(st){
  $("prevSt").textContent=st.prev; $("curSt").textContent=st.cur; $("nextSt").textContent=st.next;
  if(st.say){ $("announceTxt").textContent=st.say; const a=$("announce"); a.classList.remove("hidden","show"); void a.offsetWidth; a.classList.add("show"); }
}
let typing=null;
function typeText(str,done){ const el=$("text"); el.textContent=""; let i=0; clearInterval(typing);
  typing=setInterval(()=>{ el.textContent+=str[i++]||""; if(i>=str.length){clearInterval(typing); done&&done();} },18); }

function render(id){
  if(id==="check") return ending();
  if(id==="fgate") return render(affection>=24 ? "f2" : "check");
  const sc=SCENES[id];
  if(sc.station) showStation(sc.station);
  $("speaker").textContent=sc.speaker;
  $("speaker").className = sc.cls==="me" ? "me" : (sc.speaker==="나레이션" ? "narr" : "");
  $("meta").textContent=sc.meta||"";
  $("choices").innerHTML=""; $("next").classList.add("hidden"); $("panel").onclick=null;
  typeText(sc.text, ()=>{
    if(sc.choices){
      sc.choices.forEach(c=>{ const b=document.createElement("button"); b.className="choice";
        b.innerHTML=`<span class="tag ${c.tone||''}">${c.tag||'선택'}</span><span>${c.label}</span>`;
        b.onclick=()=>{ setAffection(c.aff||0); if(c.set)Object.assign(flags,c.set); render(c.next); };
        $("choices").appendChild(b); });
    } else if(sc.next){ $("next").classList.remove("hidden");
      $("panel").onclick=()=>{ $("panel").onclick=null; render(sc.next); }; }
  });
}
function ending(){
  ["topbar","stage","dlg"].forEach(x=>$(x).classList.add("hidden"));
  const e=ENDINGS[pickEnding(affection,flags)];
  $("endEmoji").textContent=e.emoji; $("endBadge").textContent=e.badge+"  ·  호감도 "+affection+"%";
  $("endTitle").textContent=e.title; $("endText").innerHTML=e.body;
  $("ending").classList.remove("hidden");
}
